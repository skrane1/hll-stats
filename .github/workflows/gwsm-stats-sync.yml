name: GWSM HLL Stats Sync

on:
  schedule:
    # GitHub Actions supports scheduled runs as often as every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "stats.json"
      - "scripts/sync-gwsm.mjs"
      - ".github/workflows/gwsm-stats-sync.yml"

permissions:
  contents: write

concurrency:
  group: gwsm-stats-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v3
        with:
          chromeapp: google-chrome-stable

      - name: Sync GWSM stats
        run: node scripts/sync-gwsm.mjs

      - name: Commit updated stats
        run: |
          git config user.name "GWSM Stats Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json unified-stats.json sync-meta.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-sync GWSM HLL stats"
            git push
          fi
