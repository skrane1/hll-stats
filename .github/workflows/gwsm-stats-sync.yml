name: GWSM HLL Stats Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync GWSM stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-gwsm.mjs

      - name: Commit updated stats
        run: |
          git config user.name "GWSM Stats Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json unified-stats.json sync-meta.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-sync GWSM HLL stats"
            git push
          fi
